<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>day3 workbook phone fixture</title>
    <link rel="stylesheet" href="/mrj-auth.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.55rem 0.75rem;
      }
      .btn-text {
        padding: 0.35rem 0.55rem;
        font-size: 0.85rem;
      }
      .sub {
        margin: 0.25rem 0.75rem 1.1rem;
        font-size: 0.95rem;
        max-width: 72%;
        line-height: 1.55;
        min-height: 2.75em;
      }
      h2 {
        margin: 0.5rem 0.75rem 0.25rem;
        font-size: 1.35rem;
        padding-right: 4.5rem;
      }
      .unit-list {
        margin-top: 1.95rem;
      }
      .unit-btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0.5rem 0 0;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1 style="margin: 0; font-size: 1.1rem">MRJ English · Day 3</h1>
      <button
        type="button"
        class="btn-text"
        id="btn-records"
        style="position: fixed; top: 10px; right: 72px; z-index: 10"
      >
        Records
      </button>
    </header>
    <h2>Pick a unit</h2>
    <p class="sub">One map - words change with the unit.</p>
    <div class="unit-list">
      <button type="button" class="unit-btn">Unit 1</button>
      <button type="button" class="unit-btn">Unit 2</button>
    </div>
    <script>
      globalThis.MRJ_AUTH_TEST_MODE = true;
    </script>
    <script src="/mrj-auth.js"></script>
    <script src="/mrj-auth-boot.js" data-mrj-app="day3-workbook"></script>
  </body>
</html>
